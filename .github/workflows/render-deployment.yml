name: Record Render deployment

# Render builds and deploys on its own when main is pushed (see render.yaml).
# This workflow just records that deploy in GitHub's Deployments UI so it
# shows up under the repo's "Environments" tab, pointing at the live URL.
on:
  push:
    branches: [main]

permissions:
  deployments: write

jobs:
  record-deployment:
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub deployment
        id: deployment
        uses: actions/github-script@v7
        with:
          script: |
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: 'production',
              auto_merge: false,
              required_contexts: [],
              description: 'Render deploy triggered by push to main',
            });
            core.setOutput('id', deployment.data.id);

      - name: Mark deployment in progress
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: ${{ steps.deployment.outputs.id }},
              state: 'in_progress',
              environment_url: 'https://contextquest.onrender.com',
              description: 'Render is building and deploying…',
            });

      # Render has no public "wait for deploy" API without an auth token, so
      # give it a couple minutes to build, then mark the deployment as live.
      - name: Wait for Render build
        run: sleep 150

      - name: Mark deployment success
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: ${{ steps.deployment.outputs.id }},
              state: 'success',
              environment_url: 'https://contextquest.onrender.com',
              description: 'Deployed to Render',
            });
